name: hagzy_app
description: Hagzy (حجزي) Multi-Vertical Booking & Admin App for Egypt
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hagzy_logo.svg
    - assets/venues_seed.json
