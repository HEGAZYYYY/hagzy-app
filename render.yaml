services:
  - type: static
    name: hagzy-web
    env: static
    repo: https://github.com/HEGAZYYYY/hagzy-app
    branch: main
    buildCommand: flutter pub get && flutter build web --release
    staticPublishPath: build/web
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
