services:
  # Hagzy Web Client (Flutter Web -> Supabase Auth, Realtime & Edge Functions)
  - type: web
    name: hagzy-web
    runtime: static
    buildCommand: |
      if ! command -v flutter >/dev/null 2>&1; then
        git clone https://github.com/flutter/flutter.git --depth 1 -b 3.47.7 /tmp/flutter
        export PATH="/tmp/flutter/bin:$PATH"
      fi
      flutter pub get && flutter build web --release --dart-define=HAGZY_API_URL=https://qgimngblsrfgzavuxpde.supabase.co/functions/v1/hagzy-api
    staticPublishPath: build/web
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
