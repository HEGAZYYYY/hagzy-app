name: Upload iOS to Apple App Store Connect

# Manual or tag-driven macOS build that signs Hagzy (com.hagzy.app) with your
# Apple Distribution certificate & App Store provisioning profile and uploads
# the signed .ipa directly to App Store Connect / TestFlight.
#
# Required GitHub Repository Secrets (Settings -> Secrets and variables -> Actions):
#   1. APPLE_DISTRIBUTION_CERT_BASE64        - base64 of your Apple Distribution .p12
#   2. APPLE_DISTRIBUTION_CERT_PASSWORD      - password for that .p12 file
#   3. APPLE_PROVISIONING_PROFILE_BASE64     - base64 of App Store .mobileprovision (com.hagzy.app)
#   4. APPLE_TEAM_ID                         - 10-char Apple Developer Team ID
#   5. APP_STORE_CONNECT_API_KEY_ID          - App Store Connect API Key ID
#   6. APP_STORE_CONNECT_ISSUER_ID           - App Store Connect API Issuer UUID
#   7. APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 - base64 of AuthKey_<KEY_ID>.p8

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Optional marketing version override (e.g. 1.0.0; blank uses pubspec.yaml)'
        required: false
        default: ''
      build_number:
        description: 'Optional CFBundleVersion build number override (e.g. 2; blank uses pubspec.yaml)'
        required: false
        default: ''
      skip_upload:
        description: 'Dry run: build & sign IPA without uploading to App Store Connect'
        type: boolean
        required: false
        default: false

jobs:
  upload-ios-appstore:
    name: Build, Sign & Upload iOS IPA to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required Apple signing secrets
        env:
          APPLE_DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          MISSING=()
          [ -z "$APPLE_DISTRIBUTION_CERT_BASE64" ] && MISSING+=("APPLE_DISTRIBUTION_CERT_BASE64")
          [ -z "$APPLE_DISTRIBUTION_CERT_PASSWORD" ] && MISSING+=("APPLE_DISTRIBUTION_CERT_PASSWORD")
          [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ] && MISSING+=("APPLE_PROVISIONING_PROFILE_BASE64")
          [ -z "$APPLE_TEAM_ID" ] && MISSING+=("APPLE_TEAM_ID")
          if [ "${{ inputs.skip_upload }}" != "true" ]; then
            [ -z "$APP_STORE_CONNECT_API_KEY_ID" ] && MISSING+=("APP_STORE_CONNECT_API_KEY_ID")
            [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && MISSING+=("APP_STORE_CONNECT_ISSUER_ID")
            [ -z "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" ] && MISSING+=("APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64")
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING[*]}"
            echo "Add them in GitHub -> Settings -> Secrets and variables -> Actions (see APP_STORE_PLAY_DEPLOYMENT_GUIDE.md)."
            exit 1
          fi
          echo "All required Apple signing secrets are present."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies & verify tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Install Apple Distribution certificate & provisioning profile
        env:
          APPLE_DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PP_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$APPLE_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          echo "Installed provisioning profile: $PROFILE_NAME (UUID: $PROFILE_UUID, AppID: $APP_ID)"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hagzy.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Prepare Flutter iOS build & CocoaPods
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${{ inputs.build_name }}" ]; then
            EXTRA_ARGS+=("--build-name=${{ inputs.build_name }}")
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA_ARGS+=("--build-number=${{ inputs.build_number }}")
          fi
          flutter build ios --release --no-codesign --config-only \
            --dart-define=HAGZY_API_URL=https://qgimngblsrfgzavuxpde.supabase.co/functions/v1/hagzy-api \
            "${EXTRA_ARGS[@]}"
          cd ios
          pod install --repo-update
          cd ..

      - name: Archive & export App Store signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

          ls -lh build/ios/ipa

      - name: Upload signed IPA to App Store Connect
        if: ${{ inputs.skip_upload != true }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          IPA_FILE="$(find build/ios/ipa -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_FILE" ]; then
            echo "::error::Exported .ipa not found under build/ios/ipa"
            exit 1
          fi
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagzy-iOS-AppStore-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Clean up keychain & private keys
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect/private_keys"
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f ios/ExportOptions.plist
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
