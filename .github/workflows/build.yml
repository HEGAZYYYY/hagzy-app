name: Build & Release Hagzy Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Tests, Analysis & Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run server test suite
        run: npm test --prefix server

      - name: Check client-to-server route parity
        run: node scripts/check_route_parity.js

      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=high

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release --base-href /

  build-ios:
    name: Build iPhone App (IPA)
    needs: [verify]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=HAGZY_API_URL=https://hagzy-api.onrender.com

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr Hagzy.ipa Payload
          rm -rf Payload

      - name: Upload iPhone IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagzy-iPhone-IPA
          path: Hagzy.ipa
          retention-days: 14

  build-android:
    name: Build Android App (APK & AAB)
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --dart-define=HAGZY_API_URL=https://hagzy-api.onrender.com

      - name: Build Android App Bundle (AAB for Google Play)
        run: |
          flutter build appbundle --release \
            --dart-define=HAGZY_API_URL=https://hagzy-api.onrender.com

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagzy-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hagzy-Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  publish-release:
    name: Publish GitHub Release (Downloads)
    needs: [build-ios, build-android]
    # Only publish when a version tag (v*) is pushed, not on every push to main.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hagzy-iPhone-IPA
          path: ./release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hagzy-Android-APK
          path: ./release-assets

      - name: Prepare Release Assets
        run: |
          cd release-assets
          cp app-release.apk Hagzy.apk || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Hagzy ${{ github.ref_name }} · Mobile Apps (iOS & Android)"
          body: |
            ## ⚡ Hagzy (حجزي) — Smart Instant Bookings in Egypt

            Official production release builds for iOS and Android.

            ### 📱 Direct Downloads
            | Platform | File | Size | How to Install |
            | :--- | :--- | :--- | :--- |
            | **🍎 iPhone / iPad** | [`Hagzy.ipa`](https://github.com/HEGAZYYYY/hagzy-app/releases/download/${{ github.ref_name }}/Hagzy.ipa) | ~7.8 MB | Install in 1 min with [Sideloadly](https://sideloadly.io/) or [AltStore](https://altstore.io/) |
            | **🤖 Android** | [`Hagzy.apk`](https://github.com/HEGAZYYYY/hagzy-app/releases/download/${{ github.ref_name }}/Hagzy.apk) | ~55 MB | Direct 1-tap download & install |
            | **🌐 Web App** | [Open Web App](https://hagzy-api.onrender.com) | — | Instant access in any browser |

            ### ✨ Key Features
            - 🇪🇬 **Egypt Multi-Vertical**: Padel, Football, Barbershops, and Gaming Lounges across all 27 governorates.
            - 💳 **Paymob Egypt Sandbox**: Direct test card & mobile wallet checkout.
            - 🤖 **WhatsApp AI Concierge**: Built-in booking assistant and customer support.
            - 🌐 **Bilingual (Arabic & English)**: Native RTL layout & Cairo typography.
          files: |
            release-assets/Hagzy.ipa
            release-assets/Hagzy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
