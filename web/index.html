<!DOCTYPE html>
<html>
<head>
  <script>
    // Purge any stale service worker caches so updates are immediate
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Discover and book local experiences with Hagzy.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hagzy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Hagzy</title>
  <link rel="manifest" href="manifest.json">

  <!-- Clean High-End Typography & Native System / iOS Emoji Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Alexandria:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&family=Poppins:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@500;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #059669;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", 'Plus Jakarta Sans', 'Alexandria', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }
  </style>

  <!-- Firebase App & Analytics SDK (hagzy-acea1) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
    import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, OAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvqF1vF_eobe1i-fAU1SWh7rvfKwsxlxg",
      authDomain: "hagzy-acea1.firebaseapp.com",
      projectId: "hagzy-acea1",
      storageBucket: "hagzy-acea1.firebasestorage.app",
      messagingSenderId: "112586231867",
      appId: "1:112586231867:web:c3df50a6ee9183aa500c1e",
      measurementId: "G-MNYV0KSVX4"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
      window.firebaseApp = app;
      window.firebaseAnalytics = analytics;
      window.firebaseAuth = auth;

      // Automatically catch redirect sign-in results from Google or Apple
      window.hagzyRedirectUser = null;
      getRedirectResult(auth).then(async function(result) {
        if (result && result.user) {
          const user = result.user;
          const token = await user.getIdToken();
          const name = user.displayName || (user.email ? user.email.split('@')[0] : 'Hagzy Member');
          const email = user.email || '';
          window.hagzyRedirectUser = JSON.stringify({
            token: token,
            name: name,
            email: email,
            phone: user.phoneNumber || '',
            avatar: user.photoURL || '',
            providerId: user.uid
          });
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('auth_token', token);
            url.searchParams.set('auth_name', name);
            url.searchParams.set('auth_email', email);
            window.history.replaceState({}, '', url.toString());
          } catch (_) {}
          if (typeof window.onHagzyRedirectUser === 'function') {
            window.onHagzyRedirectUser(window.hagzyRedirectUser);
          }
        }
      }).catch(function(err) {
        console.warn("Firebase Redirect Result notice:", err);
      });

      window.hagzySignInWithGoogleCallback = function(onSuccess, onError) {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        signInWithPopup(auth, provider).then(async function(result) {
          const user = result.user;
          const token = await user.getIdToken();
          onSuccess(JSON.stringify({
            token: token,
            name: user.displayName || (user.email ? user.email.split('@')[0] : 'Hagzy Member'),
            email: user.email || '',
            phone: user.phoneNumber || '',
            avatar: user.photoURL || '',
            providerId: user.uid
          }));
        }).catch(async function(err) {
          console.warn("Google popup notice, testing redirect fallback:", err.code);
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            try {
              await signInWithRedirect(auth, provider);
              onSuccess(JSON.stringify({ redirecting: true }));
            } catch (redirErr) {
              onError(redirErr.message || String(redirErr));
            }
          } else {
            onError(err.code || err.message || String(err));
          }
        });
      };

      window.hagzySignInWithAppleCallback = function(onSuccess, onError) {
        const provider = new OAuthProvider('apple.com');
        signInWithPopup(auth, provider).then(async function(result) {
          const user = result.user;
          const token = await user.getIdToken();
          onSuccess(JSON.stringify({
            token: token,
            name: user.displayName || 'Apple Member',
            email: user.email || '',
            phone: user.phoneNumber || '',
            avatar: user.photoURL || '',
            providerId: user.uid
          }));
        }).catch(async function(err) {
          console.warn("Apple popup notice, testing redirect fallback:", err.code);
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            try {
              await signInWithRedirect(auth, provider);
              onSuccess(JSON.stringify({ redirecting: true }));
            } catch (redirErr) {
              onError(redirErr.message || String(redirErr));
            }
          } else {
            onError(err.code || err.message || String(err));
          }
        });
      };

      window.hagzySignInWithGoogle = async function() {
        return new Promise(function(resolve, reject) {
          window.hagzySignInWithGoogleCallback(resolve, reject);
        });
      };

            window.hagzySignOut = function() {
        try {
          if (window.firebaseAuth) {
            window.firebaseAuth.signOut();
          }
          window.hagzyRedirectUser = null;
          const url = new URL(window.location.href);
          url.searchParams.delete('auth_token');
          url.searchParams.delete('auth_name');
          url.searchParams.delete('auth_email');
          window.history.replaceState({}, '', url.pathname + (url.search ? url.search : ''));
        } catch (e) {
          console.warn("Sign out cleanup notice:", e);
        }
      };

      window.hagzySignInWithApple = async function() {
        return new Promise(function(resolve, reject) {
          window.hagzySignInWithAppleCallback(resolve, reject);
        });
      };
    } catch (e) {
      console.warn("Firebase initialization notice:", e);
    }
  </script>
</head>
<body>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    if (window._flutter && window._flutter.buildConfig && Array.isArray(window._flutter.buildConfig.builds)) {
      var hagzyBuildBuster = Date.now();
      window._flutter.buildConfig.builds.forEach(function(b) {
        if (b && b.mainJsPath) {
          b.mainJsPath = b.mainJsPath + '?v=' + hagzyBuildBuster;
        }
      });
    }
    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: null
      },
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
